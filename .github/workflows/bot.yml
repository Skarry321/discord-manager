name: Run Discord Bot

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: discord-bot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install --omit=dev
    - name: Run bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        PORT: 8080
      run: |
        while true; do
          echo "=== Starting bot at $(date) ==="
          node bot.js
          echo "=== Bot crashed at $(date), restarting in 10s... ==="
          sleep 10
        done
